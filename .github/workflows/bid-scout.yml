name: 招标商机快报

on:
  schedule:
    # 每天北京时间 9:00 和 9:05 两个时间点触发（UTC 1:00 和 1:05）
    # 双时间点保证至少一个能触发（GitHub Actions 免费版 cron 不保证准时）
    - cron: '0 1 * * *'
    - cron: '5 1 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  bid-scout:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4

      - name: 运行招标搜索
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_AUTH_CODE: ${{ secrets.SENDER_AUTH_CODE }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python bid_scout.py

      - name: 保存邮件输出（备用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-output
          path: email_output.html
          retention-days: 7
