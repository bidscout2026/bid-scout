name: 招标商机快报

on:
  # 由 cron-job.org 每天北京时间 9:00 精准触发 workflow_dispatch
  workflow_dispatch:

jobs:
  bid-scout:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4

      - name: 运行招标搜索
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_AUTH_CODE: ${{ secrets.SENDER_AUTH_CODE }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python bid_scout.py

      - name: 保存邮件输出（备用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-output
          path: email_output.html
          retention-days: 7
